---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      version: v1.9.1
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
      interval: 1m
  targetNamespace: envoy-gateway-system
  install:
    createNamespace: true
  values:
    crds:
      enabled: true
